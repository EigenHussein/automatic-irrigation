# workspace = { members = [ "Field/deser-field", "Field/sensor-serde-maybe", "Field/serde-sensor", "Field/serde-test","libraries/control_port"] }

workspace = { members = ["libraries/control_port"] }

[package]
name = "automatic-irrigation"
version = "0.1.0"
authors = ["hussein"]
edition = "2021"
resolver = "2"
rust-version = "1.71"

[profile.release]
opt-level = "s"
strip = true

[profile.dev]
debug = true    # Symbols are nice and they don't increase the size on Flash
opt-level = "z"
strip = true

[features]
default = ["std", "embassy", "esp-idf-svc/native"]

pio = ["esp-idf-svc/pio"]
std = ["alloc", "esp-idf-svc/binstart", "esp-idf-svc/std"]
alloc = ["esp-idf-svc/alloc"]
nightly = ["esp-idf-svc/nightly"]
experimental = ["esp-idf-svc/experimental"]
embassy = [
    "esp-idf-svc/embassy-sync",
    "esp-idf-svc/critical-section",
    "esp-idf-svc/embassy-time-driver",
]


[dependencies]
log = { version = "0.4", default-features = false }
esp-idf-svc = { version = "0.47.3", default-features = false }

serde = { version = "1.0.193", features = ["derive"] }
bincode = "1.3.3"
chrono = "0.4.31"

cycloid = { path = "libraries/cycloid" }
irrigation-core = { path = "libraries/irrigation-core" }
control_port = { path = "libraries/control_port" }
serde_json = "1.0.108"
sunrise = "1.0.1"

[build-dependencies]
embuild = "0.31.3"


# [[package.metadata.esp-idf-sys.extra_components]]
# component_dirs = ["components"]
# bindings_header = "components/all.h"
# bindings_module = "name"

[package.metadata.esp-idf-sys]
extra_components = [
    { component_dirs = [
        "components/shtc3_sensor",
        "components/ssd1306",
    ], bindings_header = "components/all.h", bindings_module = "my_sensor" },
]


[[bin]]
name = "main"
path = "src/main.rs"

[[bin]]
name = "factory"
path = "src/factory.rs"


[[bin]]
name = "cnc-probing"
path = "src/cnc-probing.rs"


[[bin]]
name = "wireless-uart"
path = "src/wireless-uart.rs"


[[bin]]

name = "cnc-factory"
path = "src-cnc/factory.rs"

[[bin]]

name = "cnc-ota"
path = "src-cnc/ota.rs"


[[bin]]
name = "irrigation"
path = "src-irrigation/main.rs"
